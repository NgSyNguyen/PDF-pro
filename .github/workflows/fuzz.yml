name: fuzz

# Nightly light fuzzing (SPEC Phase 13): the samples with bytes changed at random, opened, drawn and read by PDFium,
# PDFsharp and PdfPig — the test process must survive every copy. The pull-request build runs 40 copies; this runs
# thousands. Scheduled runs happen on the default branch only.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Copies to try
        default: "3000"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      PDFPRO_FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '3000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/PdfPro.Operations.Tests --configuration Release

      - name: Fuzz and hostile files
        run: dotnet test --project tests/PdfPro.Operations.Tests --configuration Release --no-build -- --filter-class "PdfPro.Operations.Tests.Robustness.RobustnessTests"
