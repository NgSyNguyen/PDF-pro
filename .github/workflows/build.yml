name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PdfPro.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build PdfPro.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution PdfPro.slnx --configuration Release --no-build

      - name: Upload app build
        uses: actions/upload-artifact@v4
        with:
          name: PdfPro-App-${{ github.sha }}
          path: src/PdfPro.App/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 14
